services:
  - type: web
    name: forma-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FORMA_ALLOWED_ORIGINS
        value: "*"
      - key: FORMA_MAX_UPLOAD_MB
        value: "80"
